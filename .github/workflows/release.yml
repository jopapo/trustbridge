name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: tbridge-linux-gnu-x86_64
            rust_target: x86_64-unknown-linux-gnu
            bin_path: target/x86_64-unknown-linux-gnu/release/tbridge
          - os: ubuntu-latest
            artifact_name: tbridge-linux-musl-x86_64
            rust_target: x86_64-unknown-linux-musl
            bin_path: target/x86_64-unknown-linux-musl/release/tbridge
          - os: macos-latest
            artifact_name: tbridge-macos-x86_64
            rust_target: x86_64-apple-darwin
            bin_path: target/x86_64-apple-darwin/release/tbridge
          - os: windows-latest
            artifact_name: tbridge-windows-x86_64
            rust_target: x86_64-pc-windows-msvc
            bin_path: target/x86_64-pc-windows-msvc/release/tbridge.exe

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Install musl toolchain
        if: matrix.rust_target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.rust_target }}
      - name: Verify binary path (Unix)
        if: runner.os != 'Windows'
        run: |
          if [ ! -f "${{ matrix.bin_path }}" ]; then
            echo "Expected binary not found: ${{ matrix.bin_path }}"
            find target -maxdepth 5 -type f -name 'tbridge*' || true
            exit 1
          fi
      - name: Verify binary path (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${{ matrix.bin_path }}")) {
            Write-Host "Expected binary not found: ${{ matrix.bin_path }}"
            Get-ChildItem -Path target -Recurse -Filter "tbridge*" -ErrorAction SilentlyContinue
            exit 1
          }
      - name: Package artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp "${{ matrix.bin_path }}" "dist/tbridge"
          chmod +x dist/tbridge
          files=(tbridge)

          if [ "${{ runner.os }}" = "macOS" ]; then
            cp scripts/macos-unblock.sh dist/macos-unblock.sh
            chmod +x dist/macos-unblock.sh
            {
              echo 'TrustBridge macOS note:'
              echo
              echo '- This binary is currently unsigned/not notarized.'
              echo '- If Gatekeeper blocks it, run:'
              echo '    ./macos-unblock.sh ./tbridge'
              echo
              echo 'Then run:'
              echo '    ./tbridge --help'
            } > dist/README-macos.txt
            files+=(macos-unblock.sh README-macos.txt)
          fi

          tar -C dist -czf "dist/${{ matrix.artifact_name }}-${{ github.ref_name }}.tar.gz" "${files[@]}"
      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "${{ matrix.bin_path }}" "dist/tbridge.exe"
          Compress-Archive -Path "dist/tbridge.exe" -DestinationPath "dist/${{ matrix.artifact_name }}-${{ github.ref_name }}.zip" -Force
      - name: Upload artifact (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact_name }}-${{ github.ref_name }}
          path: dist/${{ matrix.artifact_name }}-${{ github.ref_name }}.tar.gz
      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact_name }}-${{ github.ref_name }}
          path: dist/${{ matrix.artifact_name }}-${{ github.ref_name }}.zip

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-binaries]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
      - name: Upload binaries to existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [ -z "$TAG_NAME" ]; then
            echo "TAG_NAME is empty; cannot upload release assets"
            exit 1
          fi

          mapfile -t files < <(find artifacts -type f)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No artifacts found to upload"
            exit 1
          fi

          gh release upload "$TAG_NAME" "${files[@]}" --clobber
