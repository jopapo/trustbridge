name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Debug module layout
        shell: pwsh
        run: |
          pwd
          git rev-parse HEAD
          Get-ChildItem -Path src/providers -Recurse -File |
            ForEach-Object { $_.FullName.Replace($PWD.Path + [IO.Path]::DirectorySeparatorChar, '') } |
            Sort-Object
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Build
        run: cargo build --locked
      - name: Test
        run: cargo test --locked
